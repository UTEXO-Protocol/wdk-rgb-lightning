name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check:types

      - name: Check optional WebRGB contract
        run: npm run check:webrgb-peer

      - name: Run tests
        run: npm test

      - name: Test fault-harness process ownership
        run: node --test tests/regtest/harness.test.mjs

      - name: Check package contents
        run: npm run check:package

  native-sources:
    name: Verify pinned native sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WDK candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Read and validate native source pins
        id: sources
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { readNativePeerSources, validateNativePeerSources } from './scripts/verify-native-peer-sources.mjs'
          const sources = validateNativePeerSources(readNativePeerSources(), JSON.parse(readFileSync('package.json', 'utf8')))
          appendFileSync(process.env.GITHUB_OUTPUT, `bare_commit=${sources.peers['@utexo/rgb-lightning-node-bare'].commit}\nnode_commit=${sources.peers['@utexo/rgb-lightning-node-nodejs'].commit}\n`)
          JS

      - name: Checkout pinned Bare source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UTEXO-Protocol/rgb-lightning-node-bare
          ref: ${{ steps.sources.outputs.bare_commit }}
          path: .native-peers/bare
          persist-credentials: false

      - name: Checkout pinned Node source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UTEXO-Protocol/rgb-lightning-node-nodejs
          ref: ${{ steps.sources.outputs.node_commit }}
          path: .native-peers/nodejs
          persist-credentials: false

      - name: Verify exact source commits and native graph
        run: npm run check:native-sources -- --bare-dir .native-peers/bare --node-dir .native-peers/nodejs
